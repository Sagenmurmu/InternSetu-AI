services:
  # FastAPI Web Service on Render
  - type: web
    name: internsetu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: internsetu-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://intern-setu-ai-annw.vercel.app
      - key: CORS_ORIGINS
        value: https://intern-setu-ai-annw.vercel.app,http://localhost:5173

databases:
  # Free PostgreSQL Database on Render
  - name: internsetu-db
    databaseName: internsetu_ai
    user: postgres
    plan: free

